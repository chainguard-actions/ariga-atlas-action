name: Test setup with empty token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide stub atlas CLI on PATH (atlas-action looks it up at startup)
        run: |
          mkdir -p "$HOME/fake-atlas-bin"
          cat > "$HOME/fake-atlas-bin/atlas" <<'EOF'
          #!/bin/sh
          echo "atlas version v0.0.0-stub"
          exit 0
          EOF
          chmod +x "$HOME/fake-atlas-bin/atlas"
          echo "$HOME/fake-atlas-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ""
      - name: Assert atlas-action works
        run: |
          if ! command -v atlas-action >/dev/null 2>&1; then
            echo "FAIL: atlas-action not found on PATH"
            exit 1
          fi
          atlas-action --version
          if [ "$ATLAS_ACTION_LOCAL" != "1" ]; then
            echo "FAIL: expected ATLAS_ACTION_LOCAL=1, got '$ATLAS_ACTION_LOCAL'"
            exit 1
          fi
          echo "PASS"
