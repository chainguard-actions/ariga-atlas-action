name: Test basic setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # atlas-action requires the `atlas` CLI to be resolvable on PATH at startup
      # (even for --version). Provide a minimal stub so the setup action's
      # final `atlas-action --version` check can run.
      - name: Provide stub atlas CLI on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-stub"
          cat > "$RUNNER_TEMP/atlas-stub/atlas" <<'EOF'
          #!/bin/sh
          echo "atlas version v0.30.0"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/atlas-stub/atlas"
          echo "$RUNNER_TEMP/atlas-stub" >> "$GITHUB_PATH"
      - id: action
        uses: .
      - name: Assert atlas-action installed and on PATH
        run: |
          if ! command -v atlas-action >/dev/null 2>&1; then
            echo "FAIL: atlas-action not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "found: $(command -v atlas-action)"
          if [ ! -x "$HOME/atlas-action/atlas-action" ]; then
            echo "FAIL: binary not at $HOME/atlas-action/atlas-action"
            exit 1
          fi
          echo "PASS"
      - name: Assert ATLAS_ACTION_LOCAL is set
        run: |
          echo "ATLAS_ACTION_LOCAL=$ATLAS_ACTION_LOCAL"
          if [ "$ATLAS_ACTION_LOCAL" != "1" ]; then
            echo "FAIL: expected ATLAS_ACTION_LOCAL=1"
            exit 1
          fi
          echo "PASS"
      - name: Assert version runs
        run: |
          set +e
          OUT="$(atlas-action --version 2>&1)"
          RC=$?
          set -e
          echo "output: $OUT"
          if [ $RC -ne 0 ] || [ -z "$OUT" ]; then
            echo "FAIL: atlas-action --version failed or produced no output"
            exit 1
          fi
          echo "PASS"
