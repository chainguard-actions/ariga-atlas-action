name: Test setup with explicit token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # atlas-action requires the `atlas` CLI to be on PATH even for --version.
      - name: Provide stub atlas CLI on PATH
        run: |
          BIN="$HOME/fake-atlas-bin"
          mkdir -p "$BIN"
          cat > "$BIN/atlas" <<'EOF'
          #!/bin/sh
          echo "atlas version v0.36.0"
          echo "https://github.com/ariga/atlas/releases/tag/v0.36.0"
          exit 0
          EOF
          chmod +x "$BIN/atlas"
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
      - name: Assert atlas-action runs
        run: |
          if ! command -v atlas-action >/dev/null 2>&1; then
            echo "FAIL: atlas-action not found on PATH"
            exit 1
          fi
          atlas-action --version
          if [ "$ATLAS_ACTION_LOCAL" != "1" ]; then
            echo "FAIL: expected ATLAS_ACTION_LOCAL=1, got '$ATLAS_ACTION_LOCAL'"
            exit 1
          fi
          echo "PASS"
