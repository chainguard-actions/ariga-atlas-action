name: Test setup with explicit token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide a stub atlas CLI on PATH (atlas-action requires it at startup)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-atlas"
          cat > "$RUNNER_TEMP/fake-atlas/atlas" <<'EOF'
          #!/bin/sh
          case "$1" in
            version|--version|-v)
              echo "atlas version v0.30.0"
              ;;
            *)
              echo "atlas stub: $*"
              ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fake-atlas/atlas"
          echo "$RUNNER_TEMP/fake-atlas" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
      - name: Assert atlas-action runs
        run: |
          if ! command -v atlas-action >/dev/null 2>&1; then
            echo "FAIL: atlas-action not found on PATH"
            exit 1
          fi
          VERSION="$(atlas-action --version)"
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: empty version output"
            exit 1
          fi
          if [ "$ATLAS_ACTION_LOCAL" != "1" ]; then
            echo "FAIL: expected ATLAS_ACTION_LOCAL=1, got '$ATLAS_ACTION_LOCAL'"
            exit 1
          fi
          echo "PASS"
