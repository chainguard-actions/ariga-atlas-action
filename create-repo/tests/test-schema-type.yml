name: Test create-repo with schema type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Requires Atlas Cloud credentials which the harness does not provide;
      # accept success or graceful failure, but never a skipped step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: act-harness-schema-repo
          driver: mysql
          type: schema
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: schema repository created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Atlas Cloud credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
