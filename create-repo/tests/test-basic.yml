name: Test basic create-repo invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Creating a repository requires an authenticated Atlas Cloud session
      # (atlas login with a cloud token), which is not available under the
      # harness. The action must still run and either succeed or fail
      # gracefully; it must never be skipped.
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: actionchain-test-repo
          driver: MYSQL
          type: migration
          description: Created by actionchain harness test
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: repository created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Atlas Cloud credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
