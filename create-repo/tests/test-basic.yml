name: Test create-repo basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Creating a repository requires an authenticated Atlas Cloud session
      # (atlas login / ATLAS_TOKEN), which is not available under the harness.
      # The action is expected to either succeed or fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: act-harness-test-repo
          driver: postgres
          type: migration
          description: Repository created by act harness test
      - name: Assert action ran (succeeded or failed gracefully without Atlas Cloud credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: repository created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Atlas Cloud credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
